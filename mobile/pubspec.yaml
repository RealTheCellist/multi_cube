name: poly_puzzle_cube
description: >
  Poly Puzzle -- a playable 5x5 (and 2x2/3x3/4x4) Rubik's-style cube game.
  Wraps the real web app (src/, this repo -- 3D cube, swipe-to-turn,
  scramble, timer, and a solver-backed "next move" help system) in a
  WebView shell for iOS/Android app store distribution. See
  docs/MOBILE_WEBVIEW_PIVOT.md for why: the whole point of this project was
  a real cube GAME with the Solver as a help feature when stuck, not a
  standalone solver utility -- and the web app already has exactly that,
  fully built and validated, so this Sprint wraps it rather than
  re-implementing any of it in Dart.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  # Official Flutter team WebView package. loadFlutterAsset() is built
  # specifically for "bundle a whole built SPA as Flutter assets and serve
  # it" -- no local HTTP server or file:// relative-path workarounds needed.
  webview_flutter: ^4.10.0
  # Needed directly (not just transitively) to call
  # AndroidWebViewController.enableDebugging() for chrome://inspect access
  # while diagnosing the black-screen report.
  webview_flutter_android: ^4.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/webapp/index.html
    - assets/webapp/favicon.svg
    - assets/webapp/assets/
