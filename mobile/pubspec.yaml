name: poly_puzzle_cube
description: >
  Poly Puzzle -- a playable 5x5 (and 2x2/3x3/4x4) Rubik's-style cube game.
  Wraps the real web app (src/, this repo -- 3D cube, swipe-to-turn,
  scramble, timer, and a solver-backed "next move" help system) in a
  WebView shell for iOS/Android app store distribution. See
  docs/MOBILE_WEBVIEW_PIVOT.md for why: the whole point of this project was
  a real cube GAME with the Solver as a help feature when stuck, not a
  standalone solver utility -- and the web app already has exactly that,
  fully built and validated, so this Sprint wraps it rather than
  re-implementing any of it in Dart.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  # Official Flutter team WebView package.
  webview_flutter: ^4.10.0
  # Needed directly (not just transitively) to call
  # AndroidWebViewController.enableDebugging() for chrome://inspect access
  # while diagnosing the black-screen report.
  webview_flutter_android: ^4.10.0
  # loadFlutterAsset() serves local files over file://, which Chromium
  # gives an opaque ("null") origin -- and it refuses ANY CORS-mode fetch
  # (which <script type="module"> and code-split dynamic import() always
  # are, unconditionally, per spec) against file://. The built web app uses
  # both, so loadFlutterAsset() renders a black screen with every JS/CSS
  # chunk "blocked by CORS policy". These three packages instead extract
  # the same, unmodified build into a real directory and serve it over a
  # local http://127.0.0.1 origin, which is subject to normal same-origin
  # rules (not the file:// CORS ban) -- the standard fix for this exact
  # class of problem, without touching the web app's build output at all.
  path_provider: ^2.1.4
  shelf: ^1.4.1
  shelf_static: ^1.1.3
  # AdMob: a persistent banner (native, above the WebView -- see main.dart)
  # plus a rewarded ad the web content can request through a JavaScript
  # channel to grant an extra daily-mission solve hint (see ad_config.dart
  # and src/nativeAds.ts on the web side for the bridge contract).
  google_mobile_ads: ^5.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/webapp/index.html
    - assets/webapp/favicon.svg
    - assets/webapp/assets/
